apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-discovery-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openshell-discovery-poc
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, update, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, create, update, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, backendtlspolicies]
    verbs: [get, list, create, update, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-discovery-poc
subjects:
  - kind: ServiceAccount
    name: openshell-discovery-poc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openshell-discovery-poc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openshell-discovery-poc
data:
  config.json: |
    {
      "controllerID": "discovery-poc",
      "namespace": "openshell",
      "gateway": "discovery-poc",
      "gatewayNamespace": "openshell",
      "listener": "apps",
      "backendCAConfigMap": "openshell-supervisor-app-ca",
      "sources": [{
        "id": "primary",
        "endpoint": "https://openshell.openshell.svc:8080",
        "workspace": "default",
        "caFile": "/run/discovery/ca.crt",
        "certFile": "/run/discovery/tls.crt",
        "keyFile": "/run/discovery/tls.key"
      }]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshell-discovery-poc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: openshell-discovery-poc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshell-discovery-poc
    spec:
      serviceAccountName: openshell-discovery-poc
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: openshell/kube-ingress-controller:poc
          imagePullPolicy: IfNotPresent
          args: [--config, /etc/controller/config.json]
          ports:
            - name: health
              containerPort: 9092
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/controller
              readOnly: true
            - name: trust
              mountPath: /run/discovery
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openshell-discovery-poc
        - name: trust
          secret:
            secretName: openshell-discovery-identity
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
