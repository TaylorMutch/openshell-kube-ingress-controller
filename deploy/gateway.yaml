apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: openshell-discovery-poc
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: discovery-poc
spec:
  gatewayClassName: openshell-discovery-poc
  listeners:
    - name: apps
      hostname: "*.services.example.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: openshell-app-ingress-tls
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Same
